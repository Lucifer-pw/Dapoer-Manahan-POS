name: dapoer_pos
description: "Dapoer Manahan - Aplikasi POS Restoran"
publish_to: 'none'
version: 1.0.4+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.66.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  blue_thermal_printer: ^1.2.3
  url_launcher: ^6.3.1
  device_info_plus: ^10.1.2
  http: ^1.2.0
  webview_flutter: ^4.8.0
  package_info_plus: ^8.0.2

  # AUTO UPDATE APK
  dio: ^5.7.0
  open_filex: ^4.4.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21